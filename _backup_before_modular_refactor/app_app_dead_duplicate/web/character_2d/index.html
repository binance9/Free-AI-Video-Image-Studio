<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Character 2D</title>
<style>
  :root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#171717;background:#f3f4f6}
  *{box-sizing:border-box}
  body{margin:0;padding:22px}
  .wrap{max-width:760px;margin:0 auto}
  .card{background:white;border:1px solid #ddd;border-radius:18px;padding:20px;box-shadow:0 8px 26px #00000010}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#666;font-size:13px;margin:0 0 18px}
  label{display:block;font-weight:650;font-size:13px;margin:13px 0 6px}
  input,textarea,select{width:100%;border:1px solid #cfd3d8;border-radius:10px;padding:11px 12px;font:inherit;background:white}
  textarea{min-height:105px;resize:vertical}
  .row{display:grid;grid-template-columns:1fr 160px;gap:12px}
  button{width:100%;border:0;border-radius:11px;padding:12px 16px;margin-top:16px;font-weight:700;font-size:15px;cursor:pointer;background:#111827;color:white}
  button:disabled{opacity:.55;cursor:wait}
  details{margin-top:14px;border-top:1px solid #eee;padding-top:12px}
  summary{cursor:pointer;font-weight:650;color:#444}
  .advanced{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .result{margin-top:16px;padding:12px;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;display:none}
  .ok{color:#087a39;font-weight:700}.bad{color:#b42318;font-weight:700}
  #preview{max-width:100%;border-radius:12px;margin-top:10px;display:none;background:#eee}
  .gate{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #e5e7eb;font-size:12px;line-height:1.45}
  .gate b{font-weight:700}
  pre{font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}
  @media(max-width:620px){.row,.advanced{grid-template-columns:1fr}body{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Character 2D — From Reference</h1>
    <p class="sub">Chọn ảnh mẫu → nhập yêu cầu → Generate. Thông số kỹ thuật đã có mặc định.</p>

    <form id="form">
      <label>Ảnh mẫu</label>
      <input name="image" type="file" accept="image/*" required />

      <label>Prompt</label>
      <textarea name="prompt" required placeholder="Ví dụ: compact chibi female elf archer, green and gold armor, blonde ponytail, one ornate bow..."></textarea>

      <div class="row">
        <div>
          <label>Preset</label>
          <select name="preset">
            <option value="compact_game" selected>compact_game</option>
          </select>
        </div>
        <div>
          <label>Strength</label>
          <input name="strength" type="number" min="0.16" max="0.42" step="0.01" value="0.28" />
        </div>
      </div>

      <details>
        <summary>Advanced</summary>
        <div class="advanced">
          <div><label>Size</label><input name="size" value="1024x1024" /></div>
          <div><label>Style</label><input name="style" value="fantasy" /></div>
          <div><label>Quality</label><select name="quality"><option>medium</option><option>high</option></select></div>
          <div><label>Min score</label><input name="min_score" type="number" value="70" /></div>
          <div><label>Max repairs</label><input name="max_repairs" type="number" value="3" /></div>
        </div>
      </details>

      <button id="go" type="submit">Generate</button>
    </form>

    <div id="result" class="result">
      <div id="status"></div>
      <img id="preview" alt="Generated result" />
      <div id="gate" class="gate"></div>
      <pre id="json"></pre>
    </div>
  </div>
</div>
<script>
const form=document.getElementById('form');
const btn=document.getElementById('go');
const box=document.getElementById('result');
const statusEl=document.getElementById('status');
const jsonEl=document.getElementById('json');
const img=document.getElementById('preview');
const gateEl=document.getElementById('gate');

form.addEventListener('submit', async (e)=>{
  e.preventDefault(); btn.disabled=true; btn.textContent='Đang tạo...';
  box.style.display='block'; statusEl.textContent='Đang xử lý'; statusEl.className=''; img.style.display='none'; gateEl.style.display='none'; gateEl.innerHTML=''; jsonEl.textContent='';
  try{
    const fd=new FormData(form);
    const r=await fetch('/character-2d/from-reference',{method:'POST',body:fd});
    const data=await r.json();
    if(!r.ok) throw new Error(data.detail || 'Request failed');
    const ok=!!data.accepted;
    statusEl.textContent=ok?'PASS — ảnh đạt gate':'REJECT — chưa đạt gate';
    statusEl.className=ok?'ok':'bad';
    jsonEl.textContent=JSON.stringify(data,null,2);
    const dbg=(data.export_gate&&data.export_gate.gate_debug)||null;
    if(dbg){
      const pct=v=>typeof v==='number'?Math.round(v*100)+'%':'—';
      gateEl.innerHTML='<b>Gate:</b> '+(dbg.operation||data.operation||'reference-edit')+
        ' · tổng '+pct(dbg.final_score)+
        ' · identity '+pct(dbg.identity_similarity)+
        ' · màu đích '+pct(dbg.target_color_score)+
        ' · weapon '+pct(dbg.weapon_score);
      gateEl.style.display='block';
    }
    const path=data.image || data.best_rejected_candidate;
    if(path){
      img.onload=()=>{img.style.display='block'};
      img.onerror=()=>{img.style.display='none'};
      img.src='/character-2d/file?path='+encodeURIComponent(path)+'&t='+Date.now();
    } else {
      img.style.display='none';
      if(!ok){
        const blockers=(data.export_gate&&data.export_gate.blockers)||[];
        statusEl.textContent='REJECT — '+(blockers.length?blockers.join(', '):'render lỗi/ảnh đen; không hiển thị candidate');
      }
    }
  }catch(err){statusEl.textContent='Lỗi: '+err.message;statusEl.className='bad'}
  finally{btn.disabled=false;btn.textContent='Generate'}
});
</script>
</body>
</html>
